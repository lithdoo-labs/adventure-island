name: Adventure Island PWA CI

on:
  pull_request:
    branches: [main]
    paths:
      - "game.json"
      - "launch.*.json"
      - "presentation.json"
      - "components/cms-actor/**"
      - "content/**"
      - "docs/game-entry.md"
      - "subsystems/**"
      - "systems/**"
      - "scripts/pwa/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "loom-realm"
      - "README.md"
      - ".github/workflows/pwa-ci.yml"
  push:
    branches: [main]
    paths:
      - "game.json"
      - "launch.*.json"
      - "presentation.json"
      - "components/cms-actor/**"
      - "content/**"
      - "docs/game-entry.md"
      - "subsystems/**"
      - "systems/**"
      - "scripts/pwa/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "loom-realm"
      - "README.md"
      - ".github/workflows/pwa-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adventure-island-pwa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-game-and-pwa-staging:
    name: Canonical Game, real PWA staging and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout the exact repository Gitlink
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify framework pin and research isolation
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD:loom-realm)"
          actual="$(git -C loom-realm rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$expected" = "93648192323bf5f57996b7b54cbae641d8a53fdb"
          test -f loom-realm/apps/pwa/scripts/build-bundle.mjs
          test -f loom-realm/apps/pwa/scripts/run-e2e.mjs
          test -f loom-realm/packages/game-launcher-hostra/package.json
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if git diff --name-only origin/main...HEAD -- research glm-work task | grep -q .; then
              echo "::error::PWA migration PR must not modify research archives"
              exit 1
            fi
          fi

      - name: Install product dependencies when root lockfile exists
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --no-audit --no-fund

      - name: Install pinned framework toolchain
        run: npm ci --prefix loom-realm --no-audit --no-fund

      - name: Build browser Controls when declared by the product manifest
        shell: bash
        run: |
          set -euo pipefail
          if node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("presentation.json","utf8")); process.exit(p.scripts?.some(s=>s.namespace==="Presentation"&&s.key==="controls/device-input.browser.js")?0:1)'; then
            npm run build:game-common-controls-input --prefix loom-realm
            test -s loom-realm/game-libs/game-common-controls/dist/browser/device-input.browser.js
          fi

      - name: Build actual framework packages and generic PWA bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run pwa:bundle
          npm run build:bundle --prefix loom-realm --workspace @loomrealm/pwa -- \
            --bundle "$GITHUB_WORKSPACE/dist/adventure-island-installation-bundle.json" \
            --app-id adventure-island \
            --base-path /pwa/adventure-island/ \
            --output-dir "$GITHUB_WORKSPACE/dist/staging/adventure-island"
          npm run build --prefix loom-realm --workspace @loomrealm/game-launcher-hostra

      - name: Install Chromium for component and PWA browser tests
        shell: bash
        run: |
          cd loom-realm
          npx playwright install --with-deps chromium

      - name: cms-actor — generated classic artifact and Node tests
        shell: bash
        run: |
          set -euo pipefail
          node components/cms-actor/scripts/build.mjs --check
          node --test components/cms-actor/test/avatar-model.test.mjs components/cms-actor/test/browser-artifact.test.mjs components/cms-actor/test/adventure-adapter.test.mjs components/cms-actor/test/adventure-clock.test.mjs | tee "$RUNNER_TEMP/cms-actor-node.tap"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/cms-actor-node.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/cms-actor-node.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/cms-actor-node.tap"

      - name: cms-actor — real Chromium integration tests
        shell: bash
        run: |
          set -euo pipefail
          node --test components/cms-actor/test/integration.chromium.test.mjs components/cms-actor/test/adventure-chromium.test.mjs | tee "$RUNNER_TEMP/cms-actor-chromium.tap"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/cms-actor-chromium.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/cms-actor-chromium.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/cms-actor-chromium.tap"

      - name: Root tests — real LoomRealm integration may not be skipped
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/adventure-island-tests.tap"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/adventure-island-tests.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/adventure-island-tests.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/adventure-island-tests.tap"

      - name: Generate and verify real generic PWA staging
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/adventure-island-installation-bundle.json > "$RUNNER_TEMP/pwa-bundle.sha256"
          npm run pwa:bundle
          sha256sum -c "$RUNNER_TEMP/pwa-bundle.sha256"
          npm run pwa:staging
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFile, stat} from "node:fs/promises";
            const root="dist/staging/adventure-island/";
            const generation=JSON.parse(await readFile(root+"generation.json","utf8"));
            const bundle=JSON.parse(await readFile(root+"installation-bundle.json","utf8"));
            const game=JSON.parse(await readFile("game.json","utf8"));
            const launch=JSON.parse(await readFile("launch.pwa.json","utf8"));
            const presentation=JSON.parse(await readFile("presentation.json","utf8"));
            assert.equal(generation.appId,"adventure-island");
            assert.equal(generation.basePath,"/pwa/adventure-island/");
            assert.match(bundle.bundleId,/^loomrealm-pwa-sha256-[0-9a-f]{64}$/);
            assert(game.subsystems.some(entry=>entry.key===game.initial.subsystem));
            assert.deepEqual(launch.subsystems.map(entry=>entry.key).sort(),game.subsystems.map(entry=>entry.key).sort());
            assert.deepEqual(bundle.executables.map(entry=>entry.logicalModule).sort(),launch.subsystems.map(entry=>entry.module).sort());
            assert.deepEqual(bundle.presentation,presentation);
            assert(bundle.content.length>0);
            const ids=bundle.content.map(entry=>JSON.stringify([entry.kind,entry.namespace,entry.key]));
            const identitySet=new Set(ids);
            assert.equal(identitySet.size,ids.length,"duplicate Content identity");
            for(const script of presentation.scripts){
              assert(identitySet.has(JSON.stringify(["resource","resource."+script.namespace,script.key])),"missing Presentation script: "+script.key);
            }
            if(game.initial.subsystem==="base"){
              assert(identitySet.has(JSON.stringify(["record","struct.AdventureAvatarPlan","bootstrap"])),"missing bootstrap AvatarPlan");
            }
            for (const file of ["index.html","window.js","session-worker.js","worker-runner.js","service-worker.js"]) {
              assert((await stat(root+file)).isFile(),file);
            }
            console.log("Real LoomRealm generic staging verified");
          '

      - name: Canonical PWA — /pwa/adventure-island/ and Service Worker
        shell: bash
        run: |
          set -euo pipefail
          target="loom-realm/apps/pwa/dist/staging/pwa/adventure-island"
          mkdir -p "$target"
          cp -a dist/staging/adventure-island/. "$target/"
          LOOMREALM_PWA_BASE_PATH=/pwa/adventure-island/ \
            node loom-realm/apps/pwa/scripts/run-e2e.mjs staging "$GITHUB_WORKSPACE/test/pwa-browser.e2e.test.mjs" | tee "$RUNNER_TEMP/adventure-island-pwa-e2e.tap"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/adventure-island-pwa-e2e.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/adventure-island-pwa-e2e.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/adventure-island-pwa-e2e.tap"
